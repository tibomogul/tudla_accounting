# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Makes the recurring entries due each day (see TudlaAccounting::RecurringEntriesJob).
  tudla_accounting_recurring_entries:
    class: TudlaAccounting::RecurringEntriesJob
    schedule: every day at 1am
  # Makes the recurring invoices due each day (see TudlaAccounting::RecurringInvoicesJob).
  tudla_accounting_recurring_invoices:
    class: TudlaAccounting::RecurringInvoicesJob
    schedule: every day at 1am
  # Emails the overdue-invoice reminders due each day (see TudlaAccounting::SendRemindersJob).
  tudla_accounting_reminders:
    class: TudlaAccounting::SendRemindersJob
    schedule: every day at 9am
  # Books in pesos with BspForexRateProvider: stores the day's BSP bulletin (see TudlaAccounting::BspRatesJob).
  # tudla_accounting_bsp_rates:
  #   class: TudlaAccounting::BspRatesJob
  #   schedule: every weekday at 11am Asia/Manila

development:
  tudla_accounting_recurring_entries:
    class: TudlaAccounting::RecurringEntriesJob
    schedule: every day at 1am
  tudla_accounting_recurring_invoices:
    class: TudlaAccounting::RecurringInvoicesJob
    schedule: every day at 1am
  tudla_accounting_reminders:
    class: TudlaAccounting::SendRemindersJob
    schedule: every day at 9am
